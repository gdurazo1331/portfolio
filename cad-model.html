<body class="cad-detail-page">
  <header>
    <nav>

  <main class="cad-detail">
    <a class="back-link" href="index.html#cad-models">&larr; Back to the CAD gallery</a>
    <div class="cad-detail-heading">
      <p class="section-kicker">CAD model study</p>
      <h2 id="model-title">CAD Model</h2>
      <p id="model-summary"></p>
    </div>
    <div class="cad-detail-layout">
      <div class="cad-detail-media">
        <img id="model-image" class="cad-detail-pdf" alt="CAD model drawing">
        <div id="jet-engine-viewer" class="model-viewer cad-detail-viewer" aria-label="Interactive 3D turbo jet engine model" hidden>
          <p class="model-status">Loading 3D model...</p>
        </div>
      </div>
      <aside class="cad-detail-notes">
        <p class="section-kicker">Project breakdown</p>
        <section class="cad-note-block">
          <h3>What</h3>
          <p id="model-what"></p>
        </section>
        <section class="cad-note-block">
          <h3>How</h3>
          <p id="model-how"></p>
        </section>
        <section class="cad-note-block">
          <h3>Why</h3>
          <p id="model-why"></p>
        </section>
        <a id="pdf-link" class="project-link" target="_blank" rel="noopener">Open PDF in a new tab</a>
      </aside>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Gabriel Durazo</p>
  </footer>

  <script>
    const models = {
      "exhaust-assembly": {
        title: "Exhaust Assembly",
        file: "images/Exhuast Assembly.pdf",
        summary: "A detailed exhaust-side assembly exploring the geometry and fit of a compact propulsion system.",
        what: "An exhaust-side assembly for a compact propulsion system.",
        how: "I modeled the transitions and interfaces in SOLIDWORKS, paying attention to concentric relationships, fit, and clear technical presentation.",
        why: "The project helped me study how propulsion hardware connects as an assembly and how its geometry can be communicated clearly."
      },
      "turbo-jet": {
        title: "Turbo Jet Engine",
        image: "images/Jet Enginer Front Angle.png",
        summary: "A complete turbojet engine assembly modeled to study propulsion hardware and mechanical structure.",
        what: "A complete turbojet engine assembly with compressor, combustion, turbine, and nozzle stages.",
        how: "I designed the assembly in SOLIDWORKS and used an interactive 3D viewer to inspect the rotating hardware, internal structure, and variable exhaust cone.",
        why: "The project connects thrust-generation concepts with the mechanical constraints that shape a working propulsion system."
      },
      "combustion-stage": {
        title: "Combustion Stage",
        file: "images/Combustion Stage.pdf",
        summary: "A combustion-stage concept built around flow paths, containment, and manufacturable geometry.",
        what: "A combustion-stage concept focused on the chamber, surrounding structure, and downstream interfaces.",
        how: "I developed the sectioned geometry in SOLIDWORKS around the expected flow path, containment needs, and manufacturable interfaces.",
        why: "The model let me examine how internal volumes and component relationships influence propulsion design."
      },
      "main-axis-assembly": {
        title: "Main Axis Assembly",
        file: "images/Main Axis Assembly.pdf",
        summary: "An assembly study centered on alignment, support, and rotating components.",
        what: "A rotating main-axis assembly organized around alignment and support components.",
        how: "I built the parts and assembly relationships in SOLIDWORKS, using the main axis to establish placement and constraints for each supporting component.",
        why: "The exercise strengthened my understanding of how alignment and assembly constraints affect mechanical performance."
      },
      rocket: {
        title: "Rocket",
        file: "images/Rocket.pdf",
        summary: "A rocket design study connecting aerodynamic form with the practical details of construction.",
        what: "A rocket body study combining an aerodynamic exterior with structural component layout.",
        how: "I developed the profile and sections as a technical CAD drawing so the proportions, interfaces, and construction decisions are easy to inspect.",
        why: "The project helped me connect aerodynamic form with the practical requirements of building and communicating a vehicle."
      },
      "bicycle-wheel": {
        title: "Bicycle Wheel",
        file: "images/Bicycle Wheel.pdf",
        summary: "A practice assembly for refining repeated geometry, mates, and radial symmetry.",
        what: "A bicycle wheel assembly made from a hub, spokes, rim, and supporting geometry.",
        how: "I used radial patterns and assembly mates in SOLIDWORKS to build the wheel around a shared axis.",
        why: "It gave me focused practice with repeated geometry, symmetry, and relationships between moving assembly components."
      },
      guitar: {
        title: "Guitar",
        file: "images/Guitar.pdf",
        summary: "A form-driven CAD study balancing surface shape, proportion, and visual presentation.",
        what: "A form-driven acoustic guitar model balancing surface shape, proportion, and detail.",
        how: "I translated the familiar object into a structured SOLIDWORKS workflow, combining larger forms with smaller modeled details.",
        why: "The project improved my ability to move from an observed object to a CAD model that is both readable and visually considered."
      },
      rotor: {
        title: "Rotor / Coil Wiring",
        file: "images/Rotor (Coil Wiring).pdf",
        summary: "An electric motor practice model focused on nested components and a clear sectional view.",
        what: "An electric motor rotor and coil-wiring study shown through a sectional arrangement.",
        how: "I organized the nested components and wiring in SOLIDWORKS so the internal relationships remain visible in the drawing.",
        why: "The model helped me explore how assembly arrangement can communicate the function of a mechanism."
      }
    };

    const key = new URLSearchParams(window.location.search).get("model");
    const model = models[key] || models["exhaust-assembly"];
    const encodedFile = model.file ? encodeURI(model.file) : "";
    const encodedImage = encodeURI(model.image || model.file.replace(/\.pdf$/i, ".png"));

    document.title = `${model.title} | Gabriel Durazo`;
    document.getElementById("model-title").textContent = model.title;
    document.getElementById("model-summary").textContent = model.summary;
    document.getElementById("model-what").textContent = model.what;
    document.getElementById("model-how").textContent = model.how;
    document.getElementById("model-why").textContent = model.why;
    const modelImage = document.getElementById("model-image");
    const modelViewer = document.getElementById("jet-engine-viewer");
    modelImage.src = encodedImage;
    modelImage.alt = `${model.title} CAD model drawing`;
    if (key === "turbo-jet") {
      modelViewer.hidden = false;
    } else {
      modelViewer.remove();
    }
    const pdfLink = document.getElementById("pdf-link");
    if (encodedFile) {
      pdfLink.href = encodedFile;
    } else {
      pdfLink.remove();
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script src="scripy.js?v=20260923-4"></script>
</body>
</html>
